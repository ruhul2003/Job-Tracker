<!doctype html>
<html lang="en" class="bg-base-300">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- Header Section -->
  <section class="w-9/12 mx-auto mt-10 p-5">

    <h1 class="text-4xl font-bold">Job Application Tracker</h1>

    <div class="flex gap-6 justify-between w-full">

      <!-- Total -->
      <div class="flex flex-col w-[400px] h-[100px] p-5 mt-6 bg-white rounded-md">
        <p class="text-sm">Total</p>
        <p id="total" class="mt-3 text-2xl font-bold">0</p>
      </div>

      <!-- Interview -->
      <div class="flex flex-col w-[400px] h-[100px] p-5 mt-6 bg-white rounded-md">
        <p class="text-sm">Interview</p>
        <p id="interview-count" class="mt-3 text-2xl text-green-400 font-bold">0</p>
      </div>

      <!-- Rejected -->
      <div class="flex flex-col w-[400px] h-[100px] p-5 mt-6 bg-white rounded-md">
        <p class="text-sm">Rejected</p>
        <p id="rejected-count" class="mt-3 text-2xl text-red-500 font-bold">0</p>
      </div>

    </div>

    <hr class="mt-6 text-[#b3b1b1]" />

  </section>

  <!-- Main Section -->
  <section class="w-9/12 mx-auto p-5 text-[#002C5C]">

    <div class="flex justify-between">
      <p class="text-xl font-bold">Available Jobs</p>
      <p><span id="job-count">0</span> jobs</p>
    </div>

    <!-- Filter Buttons -->
    <div class="flex gap-5 mt-5">
      <button class="w-[80px] h-8 btn btn-primary">All</button>
      <button id="interview-filter" class="w-[80px] h-8 btn btn-soft">Interview</button>
      <button id="rejected-filter" class="w-[80px] h-8 btn btn-soft">Rejected</button>
    </div>

    <!-- Job Cards Container -->
    <div id="cards">
      <!-- Job Card -->

      <!---card-1----->

      <div class="job-card p-5 mt-5 bg-white rounded-md border-l-4 border-[#002C5C] shadow-lg">

        <div class="flex justify-between items-center pr-4">
          <div>
            <h2 class="text-lg font-bold">Mobile First Corp</h2>
            <p class="mt-3 text-[16px] text-[#64748B]">React Native Developer</p>
          </div>

          <i class="delete fa-regular fa-trash-can text-[#64748B] p-3 bg-[#F1F2F4] rounded-full hover:cursor-pointer"></i>
        </div>

        <p class="mt-5 text-sm text-[#64748B]">Remote • Full-time • $130,000 - $175,000</p>

        <button class="interview-toggle hidden btn btn-primary bg-transparent shadow-none mt-4 px-3 py-2 text-green-400 border border-green-400 rounded-md font-bold ">INTERVIEW</button>
        <button class="rejected-toggle hidden btn btn-primary bg-transparent shadow-none mt-4 px-3 py-2 text-[#EF4444] border border-[#EF4444] rounded-md font-bold ">REJECTED</button>

        <p class="notApplied px-3 py-2 mt-5 text-sm font-semibold bg-[#F1F2F4] rounded-md w-[113px] text-[#002C5C]">NOT APPLIED</p>

        <p class="mt-2 text-[#323B49]">Build cross-platform mobile applications using React Native.</p>

        <div class="flex gap-4 mt-5">
          <button class="interview-btn btn btn-primary bg-transparent shadow-none px-3 py-2 text-green-400 border border-green-400 rounded-md font-bold hover: cursor-pointer">INTERVIEW</button>

          <button class="rejected-btn btn btn-primary bg-transparent shadow-none px-3 py-2 text-[#EF4444] border border-[#EF4444] rounded-md font-bold hover: cursor-pointer">REJECT</button>
        </div>
      </div>
    </div>

  </section>

  <!-- Interview filter Section -->
  <section id="interview-list">

  </section>

  <script src="./script.js"></script>
</body>
</html>
